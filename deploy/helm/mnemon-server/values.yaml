replicaCount: 2

image:
  repository: mnemon-dev/mnemon-server
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 7443

# Per-principal personal insight cap (org layer is not auto-pruned).
maxInsights: 25000

# SQLite PVC is off by default. Helm serves Postgres (bundled or external).
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""

server:
  addr: ":7443"
  # HS256 signing key only (key jwt.key by default). Independent of TLS so
  # External Secrets / AWS Secrets Manager can own the JWT secret.
  existingSecret: ""
  jwtKeyKey: jwt.key
  tlsCertKey: tls.crt
  tlsKeyKey: tls.key
  tls:
    enabled: true
    existingSecret: ""
    # Mount this key from the TLS secret as /config/ca.crt. Empty means
    # mount ca.crt only when this chart generated the TLS secret.
    caKey: ""

# Ingress is off by default. Pair with cert-manager or an existing TLS secret.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mnemon.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Optional cert-manager Certificate. When enabled, set server.tls.existingSecret
# to the same secretName (cert-manager writes tls.crt/tls.key).
certManager:
  enabled: false
  issuerKind: ClusterIssuer
  issuerName: letsencrypt-prod
  secretName: ""
  dnsNames: []

# Bundled Postgres for first bring-up. Disable and set database.url or
# database.existingSecret for Amazon RDS.
postgresql:
  enabled: true
  image: postgres:16-alpine
  auth:
    username: mnemon
    database: mnemon
    password: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

# External DSN disables bundled Postgres when url or existingSecret is set.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: url

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
