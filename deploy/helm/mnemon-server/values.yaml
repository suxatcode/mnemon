replicaCount: 2

image:
  repository: mnemon-dev/mnemon-server
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 7443

# Per-principal personal insight cap (org layer is not auto-pruned).
maxInsights: 25000

# SQLite PVC is off by default. Helm serves Postgres (bundled or external).
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""

server:
  addr: ":7443"
  # If set, must contain jwt.key and, when TLS is enabled, tls.crt and tls.key.
  existingSecret: ""
  jwtKeyKey: jwt.key
  tlsCertKey: tls.crt
  tlsKeyKey: tls.key
  tls:
    enabled: true
    existingSecret: ""

# Bundled Postgres for first bring-up. Disable and set database.url or
# database.existingSecret for Amazon RDS.
postgresql:
  enabled: true
  image: postgres:16-alpine
  auth:
    username: mnemon
    database: mnemon
    password: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

# External DSN disables bundled Postgres when url or existingSecret is set.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: url

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
