{{- if include "mnemon-server.useBundledPostgres" . }}
{{- $secretName := include "mnemon-server.postgresSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := .Values.postgresql.auth.password }}
{{- if not $password }}
{{- $password = randAlphaNum 24 }}
{{- if and $existing (index $existing.data "postgres-password") }}
{{- $password = index $existing.data "postgres-password" | b64dec }}
{{- end }}
{{- end }}
{{- $host := include "mnemon-server.postgresHost" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: {{ include "mnemon-server.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  postgres-password: {{ $password | quote }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgresql.auth.username $password $host .Values.postgresql.auth.database | quote }}
{{- end }}
