apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mnemon-server.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "mnemon-server.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ include "mnemon-server.replicas" . }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mnemon-server.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mnemon-server.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mnemon-server.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mnemon-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - serve
            - --addr={{ .Values.server.addr }}
            - --max-insights={{ .Values.maxInsights }}
            - --jwt-key=/config/{{ .Values.server.jwtKeyKey }}
            {{- if .Values.oidc.enabled }}
            - --oidc-issuer={{ required "oidc.issuer is required when oidc.enabled" .Values.oidc.issuer }}
            - --oidc-audience={{ required "oidc.audience is required when oidc.enabled" .Values.oidc.audience }}
            {{- if .Values.oidc.jwksUrl }}
            - --oidc-jwks-url={{ .Values.oidc.jwksUrl }}
            {{- end }}
            {{- if .Values.oidc.principalClaim }}
            - --oidc-principal-claim={{ .Values.oidc.principalClaim }}
            {{- end }}
            {{- if ne (.Values.oidc.provision | default "auto") "allowlist" }}
            - --oidc-allow-claim={{ required "oidc.allowClaim is required unless oidc.provision is allowlist" .Values.oidc.allowClaim }}
            - --oidc-allow-value={{ required "oidc.allowValue is required unless oidc.provision is allowlist" .Values.oidc.allowValue }}
            {{- else if and .Values.oidc.allowClaim .Values.oidc.allowValue }}
            - --oidc-allow-claim={{ .Values.oidc.allowClaim }}
            - --oidc-allow-value={{ .Values.oidc.allowValue }}
            {{- end }}
            {{- if .Values.oidc.provision }}
            - --oidc-provision={{ .Values.oidc.provision }}
            {{- end }}
            {{- if and .Values.oidc.roleClaim .Values.oidc.orgValue }}
            - --oidc-role-claim={{ .Values.oidc.roleClaim }}
            - --oidc-org-value={{ .Values.oidc.orgValue }}
            {{- end }}
            {{- end }}
            {{- if not (include "mnemon-server.usePostgres" .) }}
            - --data-dir=/data
            {{- end }}
            {{- if .Values.server.tls.enabled }}
            - --tls-cert=/config/{{ .Values.server.tlsCertKey }}
            - --tls-key=/config/{{ .Values.server.tlsKeyKey }}
            {{- end }}
          env:
            - name: MNEMON_MAX_INSIGHTS
              value: {{ .Values.maxInsights | quote }}
            - name: MNEMON_DATA_DIR
              value: /data
            {{- if include "mnemon-server.usePostgres" . }}
            - name: MNEMON_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mnemon-server.databaseSecretName" . }}
                  key: {{ include "mnemon-server.databaseSecretKey" . }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: {{ include "mnemon-server.portName" . }}
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ include "mnemon-server.portName" . }}
              scheme: {{ if .Values.server.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ include "mnemon-server.portName" . }}
              scheme: {{ if .Values.server.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- if not (include "mnemon-server.usePostgres" .) }}
            - name: data
              mountPath: /data
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          projected:
            sources:
              - secret:
                  name: {{ include "mnemon-server.jwtSecretName" . }}
                  items:
                    - key: {{ .Values.server.jwtKeyKey }}
                      path: {{ .Values.server.jwtKeyKey }}
              {{- if .Values.server.tls.enabled }}
              - secret:
                  name: {{ include "mnemon-server.tlsSecretName" . }}
                  items:
                    - key: {{ .Values.server.tlsCertKey }}
                      path: {{ .Values.server.tlsCertKey }}
                    - key: {{ .Values.server.tlsKeyKey }}
                      path: {{ .Values.server.tlsKeyKey }}
                    {{- if include "mnemon-server.mountCA" . }}
                    - key: {{ .Values.server.tls.caKey | default "ca.crt" }}
                      path: ca.crt
                    {{- end }}
              {{- end }}
        {{- if not (include "mnemon-server.usePostgres" .) }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mnemon-server.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
