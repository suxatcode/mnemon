{{- if not .Values.server.existingSecret }}
{{- $secretName := include "mnemon-server.appSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $jwt := randAlphaNum 48 }}
{{- if and $existing (index $existing.data "jwt.key") }}
{{- $jwt = index $existing.data "jwt.key" | b64dec }}
{{- end }}
{{- $tlsCrt := "" }}
{{- $tlsKey := "" }}
{{- $caCrt := "" }}
{{- if and $existing (index $existing.data "tls.crt") (index $existing.data "tls.key") }}
{{- $tlsCrt = index $existing.data "tls.crt" | b64dec }}
{{- $tlsKey = index $existing.data "tls.key" | b64dec }}
{{- if index $existing.data "ca.crt" }}
{{- $caCrt = index $existing.data "ca.crt" | b64dec }}
{{- end }}
{{- else }}
{{- $ca := genCA "mnemon-ca" 3650 }}
{{- $cn := include "mnemon-server.fullname" . }}
{{- $cert := genSignedCert $cn (list) (list $cn (printf "%s.%s" $cn .Release.Namespace) (printf "%s.%s.svc" $cn .Release.Namespace)) 3650 $ca }}
{{- $tlsCrt = $cert.Cert }}
{{- $tlsKey = $cert.Key }}
{{- $caCrt = $ca.Cert }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: {{ include "mnemon-server.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  jwt.key: {{ $jwt | quote }}
  {{- if .Values.database.url }}
  url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.server.tls.enabled (not .Values.server.tls.existingSecret) }}
  tls.crt: |
{{ $tlsCrt | indent 4 }}
  tls.key: |
{{ $tlsKey | indent 4 }}
  ca.crt: |
{{ $caCrt | indent 4 }}
  {{- end }}
{{- end }}
