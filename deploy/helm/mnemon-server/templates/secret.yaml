{{- $jwtName := include "mnemon-server.jwtSecretName" . }}
{{- $tlsName := include "mnemon-server.tlsSecretName" . }}
{{- $generateJWT := not .Values.server.existingSecret }}
{{- $generateTLS := include "mnemon-server.generateTLS" . }}
{{- $tlsInJWT := and $generateJWT $generateTLS (eq $jwtName $tlsName) }}
{{- $tlsStandalone := and $generateTLS (ne $jwtName $tlsName) }}
{{- $generateURL := and .Values.database.url (not .Values.database.existingSecret) }}
{{- $urlStandalone := and $generateURL .Values.server.existingSecret }}

{{- if $generateJWT }}
{{- $secretName := $jwtName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $jwt := randAlphaNum 48 }}
{{- if and $existing (index $existing.data "jwt.key") }}
{{- $jwt = index $existing.data "jwt.key" | b64dec }}
{{- end }}
{{- $tlsCrt := "" }}
{{- $tlsKey := "" }}
{{- $caCrt := "" }}
{{- if $tlsInJWT }}
{{- if and $existing (index $existing.data "tls.crt") (index $existing.data "tls.key") }}
{{- $tlsCrt = index $existing.data "tls.crt" | b64dec }}
{{- $tlsKey = index $existing.data "tls.key" | b64dec }}
{{- if index $existing.data "ca.crt" }}
{{- $caCrt = index $existing.data "ca.crt" | b64dec }}
{{- end }}
{{- else }}
{{- $ca := genCA "mnemon-ca" 3650 }}
{{- $cn := include "mnemon-server.fullname" . }}
{{- $cert := genSignedCert $cn (list "127.0.0.1") (list $cn (printf "%s.%s" $cn .Release.Namespace) (printf "%s.%s.svc" $cn .Release.Namespace) (printf "%s.%s.svc.cluster.local" $cn .Release.Namespace) "localhost") 3650 $ca }}
{{- $tlsCrt = $cert.Cert }}
{{- $tlsKey = $cert.Key }}
{{- $caCrt = $ca.Cert }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: {{ include "mnemon-server.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: jwt
type: Opaque
stringData:
  jwt.key: {{ $jwt | quote }}
  {{- if and $generateURL (not $urlStandalone) }}
  url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if $tlsInJWT }}
  tls.crt: |
{{ $tlsCrt | indent 4 }}
  tls.key: |
{{ $tlsKey | indent 4 }}
  ca.crt: |
{{ $caCrt | indent 4 }}
  {{- end }}
{{- end }}

{{- if $tlsStandalone }}
{{- $tlsExisting := lookup "v1" "Secret" .Release.Namespace $tlsName }}
{{- $tlsCrt := "" }}
{{- $tlsKey := "" }}
{{- $caCrt := "" }}
{{- if and $tlsExisting (index $tlsExisting.data "tls.crt") (index $tlsExisting.data "tls.key") }}
{{- $tlsCrt = index $tlsExisting.data "tls.crt" | b64dec }}
{{- $tlsKey = index $tlsExisting.data "tls.key" | b64dec }}
{{- if index $tlsExisting.data "ca.crt" }}
{{- $caCrt = index $tlsExisting.data "ca.crt" | b64dec }}
{{- end }}
{{- else }}
{{- $ca := genCA "mnemon-ca" 3650 }}
{{- $cn := include "mnemon-server.fullname" . }}
{{- $cert := genSignedCert $cn (list "127.0.0.1") (list $cn (printf "%s.%s" $cn .Release.Namespace) (printf "%s.%s.svc" $cn .Release.Namespace) (printf "%s.%s.svc.cluster.local" $cn .Release.Namespace) "localhost") 3650 $ca }}
{{- $tlsCrt = $cert.Cert }}
{{- $tlsKey = $cert.Key }}
{{- $caCrt = $ca.Cert }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels:
    app.kubernetes.io/name: {{ include "mnemon-server.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
stringData:
  tls.crt: |
{{ $tlsCrt | indent 4 }}
  tls.key: |
{{ $tlsKey | indent 4 }}
  ca.crt: |
{{ $caCrt | indent 4 }}
{{- end }}

{{- if $urlStandalone }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mnemon-server.fullname" . }}-database
  labels:
    app.kubernetes.io/name: {{ include "mnemon-server.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  url: {{ .Values.database.url | quote }}
{{- end }}
