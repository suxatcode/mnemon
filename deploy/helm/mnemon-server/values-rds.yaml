# Production overlay: Amazon RDS (or other external Postgres).
# Point database.existingSecret at a Secret whose `url` key is a postgres:// DSN
# (for example from External Secrets / AWS Secrets Manager).
#
# This chart never deploys Postgres. Create the DSN secret first.
replicaCount: 2
maxInsights: 25000
persistence:
  enabled: false
database:
  existingSecret: mnemon-db
  existingSecretKey: url
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
