name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.3']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mnemon
          POSTGRES_PASSWORD: mnemon
          POSTGRES_DB: mnemon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_URL: postgres://mnemon:mnemon@localhost:5432/mnemon?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Build
        run: make build build-server

      - name: Run unit tests
        run: go test ./...

      - name: Run E2E tests
        run: make test
