name: Delete pre-1.0 Helm chart versions

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete OCI tags 0.1.0 and 0.1.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          pkg="container/charts%2Fmnemon-server"
          gh api --paginate "/users/${OWNER}/packages/${pkg}/versions" \
            --jq '.[] | {id, tags: .metadata.container.tags}'
          for ver in 0.1.0 0.1.1; do
            id="$(gh api --paginate "/users/${OWNER}/packages/${pkg}/versions" \
              --jq ".[] | select(.metadata.container.tags[]? == \"$ver\") | .id" | head -n1)"
            if [ -z "$id" ]; then
              echo "no package version id for tag $ver (already gone?)"
              continue
            fi
            echo "deleting $ver id=$id"
            gh api --method DELETE "/users/${OWNER}/packages/${pkg}/versions/${id}"
          done
          echo "remaining:"
          gh api --paginate "/users/${OWNER}/packages/${pkg}/versions" \
            --jq '.[] | {id, tags: .metadata.container.tags}'
