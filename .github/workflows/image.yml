name: Publish mnemon-server image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: git sha)"
        required: false
        default: ""
  push:
    branches:
      - feat/remote-gateway
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/mnemon-server" >> "$GITHUB_OUTPUT"
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="${GITHUB_SHA::12}"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:dev
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            GO_VERSION=1.25.3
