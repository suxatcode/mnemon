# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: mnemon
    main: .
    binary: mnemon
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/suxatcode/mnemon/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^Merge"

release:
  github:
    owner: suxatcode
    name: mnemon
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    v{{.Version}} focuses on stable CLI, storage, and entity-graph behavior.

    Note: harness modules, harness documentation, and harness evaluation assets in this repository remain experimental and are not part of this release's public stability guarantee.
